spring.application.name=Bracket Racing

# Unlike the docker profile's hardcoded "db" compose network alias, AWS needs
# the real RDS endpoint - passed as a plain (non-secret) env var since a
# hostname isn't sensitive on its own.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# jwt.secret / jwt.expiration-ms are already read from JWT_SECRET /
# JWT_EXPIRATION_MS in the base application.properties - nothing profile-
# specific needed here.
